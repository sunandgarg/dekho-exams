AWSTemplateFormatVersion: '2010-09-09'
Description: DekhoExams Node origin, private MySQL and private S3 media
Parameters:
  Zone:
    Type: AWS::EC2::AvailabilityZone::Name
  InstanceBundle:
    Type: String
  DatabaseBlueprint:
    Type: String
  AdminCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  KeyPairName:
    Type: String
Resources:
  Origin:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: dekhoexams-node
      AvailabilityZone: !Ref Zone
      BlueprintId: ubuntu_24_04
      BundleId: !Ref InstanceBundle
      KeyPairName: !Ref KeyPairName
      Networking:
        Ports:
          - {Protocol: tcp, FromPort: 22, ToPort: 22, Cidrs: [!Ref AdminCidr]}
          - {Protocol: tcp, FromPort: 80, ToPort: 80, Cidrs: ['0.0.0.0/0']}
          - {Protocol: tcp, FromPort: 443, ToPort: 443, Cidrs: ['0.0.0.0/0']}
  Address:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: dekhoexams-origin
      AttachedTo: !Ref Origin
  Archive:
    Type: AWS::Lightsail::Database
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RelationalDatabaseName: dekhoexams-mysql
      RelationalDatabaseBundleId: micro_1_0
      RelationalDatabaseBlueprintId: !Ref DatabaseBlueprint
      AvailabilityZone: !Ref Zone
      BackupRetention: true
      PubliclyAccessible: false
      MasterDatabaseName: dekhoexams
      MasterUsername: dekhoadmin
  Media:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
  Reader:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: ReadPublishedMedia
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${Media.Arn}/jee-papers/*'
                  - !Sub '${Media.Arn}/jee-figures/*'
Outputs:
  MediaBucket: {Value: !Ref Media}
  ReaderUser: {Value: !Ref Reader}
  OriginIP: {Value: !GetAtt Address.IpAddress}
